name: Update profile art

# Only the heatmap changes daily. The portrait + info card are static —
# regenerate those locally when your photo or details change.
"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The daily job only needs the two lightweight libraries — not the
      # portrait toolchain (opencv/rembg), which keeps the run fast.
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Fetch contributions
        env:
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
